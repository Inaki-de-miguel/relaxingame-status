# Upptime configuration for RelaxInGame Studio
# Docs: https://upptime.js.org/docs/configuration

owner: Inaki-de-miguel # GitHub username
repo: relaxingame-status # This repository
user-agent: Inaki-de-miguel

# Endpoints to monitor.
# The backend is only reachable through Railway's private network, so every
# backend check goes through the website: /api/status.php calls the matching
# /health endpoint internally and only answers {"status":"ok"} or "down".
# Keep the slugs as they are: the status page and its history depend on them.
sites:
  - name: Website
    slug: web
    url: https://relaxingame.app
    maxResponseTime: 5000 # slower than 5 s counts as "degraded"

  # The stats backend is responding
  - name: Stats API
    slug: estadisticas
    url: https://relaxingame.app/api/status.php?check=stats
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # The backend can reach Supabase (real query)
  - name: Database
    slug: base-de-datos
    url: https://relaxingame.app/api/status.php?check=db
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # The backend's RIOT_API_KEY is valid
  - name: Riot API
    slug: api-riot
    url: https://relaxingame.app/api/status.php?check=riot
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # User sign-in (Supabase Auth)
  - name: Sign in
    slug: login
    url: https://relaxingame.app/api/status.php?check=auth
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # The scheduler keeps syncing matches and the queue isn't stuck
  - name: Match sync
    slug: sync
    url: https://relaxingame.app/api/status.php?check=sync
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # The Claude API key is valid (no tokens spent)
  - name: AI Coach
    slug: ai-coach
    url: https://relaxingame.app/api/status.php?check=ai
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

# Assign every downtime issue to you
assignees:
  - Inaki-de-miguel

# Keep incidents in the history even if they last less than 15 minutes
skipDeleteIssues: true

# The public page is our own (repo relaxingame-status-page, served at
# status.relaxingame.app). Upptime's built-in page stays only as a backup at
# inaki-de-miguel.github.io/relaxingame-status, without a custom domain.
status-website:
  baseUrl: /relaxingame-status
  name: RelaxInGame Studio
  theme: dark
