# Configuración de Upptime para RelaxInGame Studio
# Docs: https://upptime.js.org/docs/configuration

owner: Inaki-de-miguel # Usuario de GitHub
repo: relaxingame-status # Nombre de este repo
user-agent: Inaki-de-miguel

# Endpoints a vigilar.
sites:
  - name: Web
    url: https://relaxingame.app
    maxResponseTime: 5000 # más de 5 s cuenta como "degradado"

  # Backend de estadísticas (Python). URL provisional de Railway:
  # cuando se mueva a la red interna, sustituir por un health de la web.
  - name: Estadísticas
    slug: estadisticas
    url: https://web-production-f2a7e.up.railway.app/health
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # Comprueba con una consulta real que el backend llega a Supabase
  - name: Base de datos
    slug: base-de-datos
    url: https://web-production-f2a7e.up.railway.app/health/db?deep_check=true
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"supabase_connected":true'

  # Comprueba que la RIOT_API_KEY es válida (resultado cacheado 60 s en el backend)
  - name: API de Riot
    slug: api-riot
    url: https://web-production-f2a7e.up.railway.app/health/riot
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # Login de usuarios (Supabase Auth)
  - name: Inicio de sesión
    slug: login
    url: https://web-production-f2a7e.up.railway.app/health/auth
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # El scheduler sigue sincronizando partidas y no hay cola atascada
  - name: Sincronización de partidas
    slug: sync
    url: https://web-production-f2a7e.up.railway.app/health/sync
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  # Valida la clave de Claude sin gastar tokens (cacheado 5 min en el backend)
  - name: AI Coach
    slug: ai-coach
    url: https://web-production-f2a7e.up.railway.app/health/ai
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"status":"ok"'

# Te asigna a ti los issues de caída
assignees:
  - Inaki-de-miguel

# Mantiene el historial de incidentes aunque duren menos de 15 min
skipDeleteIssues: true

status-website:
  cname: status.relaxingame.app
  name: RelaxInGame Studio
  introTitle: "**Estado de los servicios**"
  introMessage: Estado en tiempo real de relaxingame.app. Si algo falla, lo verás aquí primero.
  theme: dark
  navbar:
    - title: Estado
      href: /
    - title: relaxingame.app
      href: https://relaxingame.app
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap
  metaTags:
    - name: color-scheme
      content: dark
    - name: theme-color
      content: "#000000"
  # Estética "web de análisis": negro, monospace, bordes de 1px, sin radios
  # ni sombras, textura de puntos y acento teal de marca.
  css: |
    :root {
      --body-background-color: #000000;
      --body-text-color: #d9d9d9;
      --card-background-color: #050505;
      --card-border-color: #1c1c1c;
      --nav-background-color: #000000;
      --nav-border-bottom-color: #1c1c1c;
      --nav-current-border-bottom-color: #2bb3bd;
      --up-border-left-color: #2bb3bd;
      --degraded-border-left-color: #e0a526;
      --down-border-left-color: #e5484d;
      --down-background-color: #1a0607;
      --tag-color: #000000;
      --tag-up-background-color: #2bb3bd;
      --tag-degraded-background-color: #e0a526;
      --tag-down-background-color: #e5484d;
      --change-background-color: #e0a526;
      --error-button-border-color: #207981;
      --error-button-background-color: #207981;
      --error-button-color: #ffffff;
      --submit-button-border-color: #207981;
      --submit-button-background-color: #207981;
      --submit-button-color: #ffffff;
      --graph-opacity: 0.9;
      --graph-filter: grayscale(1) brightness(1.4);
    }
    html, body {
      background-color: #000000;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 18px 18px;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.01em;
    }
    *, *::before, *::after {
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    a { color: #2bb3bd; }
    a:hover { color: #5fd4dc; }
    h1, h2, h3, h4 {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    nav { border-bottom: 1px solid #1c1c1c; }
    article, section > div, .card, li {
      border-width: 1px !important;
    }
    img[alt*="graph"], img[alt*="Response"] { opacity: 0.9; }

